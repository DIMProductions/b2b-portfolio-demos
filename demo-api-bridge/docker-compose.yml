services:
  redis:
    image: redis:alpine
    # Demo-only default password. Override REDIS_PASSWORD in a real
    # deployment — never reuse this value outside local demo use.
    # No host port mapping: only other containers on this compose
    # network can reach Redis, not the host machine or outside world.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-demo-local-only}"]

  mock-upstream:
    image: python:3.11-slim
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "pip install fastapi uvicorn && uvicorn src.mock_upstream:app --host 0.0.0.0 --port 8001"
    ports:
      - "8001:8001"

  bridge:
    build: .
    environment:
      - UPSTREAM_URL=http://mock-upstream:8001/v1/customers
      - REDIS_URL=redis://:${REDIS_PASSWORD:-demo-local-only}@redis:6379
    depends_on:
      - redis
      - mock-upstream
    ports:
      - "8000:8000"
