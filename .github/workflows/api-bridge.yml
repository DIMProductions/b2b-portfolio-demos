name: API Bridge

on:
  push:
    paths:
      - 'demo-api-bridge/**'
      - '.github/workflows/api-bridge.yml'
  pull_request:
    paths:
      - 'demo-api-bridge/**'
      - '.github/workflows/api-bridge.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-api-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/ -v
      - name: Verify Dockerfile builds
        run: docker build -t api-bridge-check .
